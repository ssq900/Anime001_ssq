name: anime_app
description: A simple anime viewer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  html: ^0.15.6
  json_path: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_video_player: any
  dart_cast: ^0.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
